[project]
name = "epd-core"
version = "1.0.0"
description = "Entropy-Price Divergence — structural tension indicator (RSI-style bounded)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "EPD Research" }]
keywords = ["entropy", "permutation-entropy", "technical-analysis", "quant"]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
viz = ["plotly>=5.0", "yfinance>=0.2"]
dev = ["pytest>=7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epd_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]